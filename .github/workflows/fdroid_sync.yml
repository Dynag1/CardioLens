name: Sync to F-Droid Repo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy-to-fdroid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout App Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $ENCODED_KEYSTORE | base64 -di > app/release-key.jks

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Checkout F-Droid Repository
        uses: actions/checkout@v4
        with:
          repository: Dynag1/Dynag1-Fdroid
          token: ${{ secrets.PAT }}
          path: fdroid_repo

      - name: Copy Artifacts to F-Droid Repo
        run: |
          APP_ID="com.cardio.fitbit"
          
          # Create directories in the fdroid repository structure
          mkdir -p fdroid_repo/apks/$APP_ID
          mkdir -p fdroid_repo/metadata/$APP_ID
          
          # Get version from tag or fallback to latest
          VERSION=${GITHUB_REF_NAME:-latest}
          
          # Copy APK
          cp app/build/outputs/apk/release/app-release.apk fdroid_repo/apks/$APP_ID/CardioLens-$VERSION.apk
          
          # Copy metadata if available
          if [ -d "fastlane/metadata/android" ]; then
            cp -r fastlane/metadata/android/* fdroid_repo/metadata/$APP_ID/ || true
          fi

      - name: Commit and Push to F-Droid Repo
        run: |
          cd fdroid_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add apks/
          git add metadata/
          
          # Commit only if there are changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-deploy: Update CardioLens ($GITHUB_REF_NAME)"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi
